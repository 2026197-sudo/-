<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>자율성과지표 현황 · 계명문화대학교 AI 사업단</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('kmcuKpiTheme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<header>
  <div class="brand-line"></div>
  <div class="topbar">
    <div class="wrap">
      <a class="brand" href="./">
        <img src="img/logo.png" alt="계명문화대학교 KEIMYUNG COLLEGE UNIVERSITY">
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-text"><span class="unit">AI 사업단 · 기획팀 / IR센터</span><span class="sys">성과관리 시스템</span></span>
      </a>
      <div class="tools">
        <span class="clock"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><time id="clock"></time></span>
        <button type="button" id="themeToggle" class="btn-theme" aria-pressed="false">
          <svg class="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <span class="theme-label">다크 모드</span>
        </button>
        <button type="button" id="reportBtn" class="btn btn-report" aria-haspopup="dialog">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
          AI 요약보고서
        </button>
      </div>
    </div>
  </div>
  <nav class="nav" aria-label="주 메뉴">
    <div class="wrap">
      <a href="#summary" aria-current="page">종합</a>
      <a href="#detail">세부지표</a>
      <a href="#notes">유의사항</a>
      <a href="#fix">정리 필요</a>
      <a href="admin.html">실적 입력</a>
    </div>
  </nav>
</header>

<main class="wrap" id="app" aria-live="polite">
  <p class="dim">자료를 불러오는 중입니다…</p>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> 계명문화대학교 AI 사업단 · 기획팀 / IR센터</span>
    <span id="updated"></span>
  </div>
</footer>

<dialog id="reportDialog" class="report-dialog" aria-labelledby="reportTitle">
  <div class="rp-toolbar">
    <span class="rp-toolbar-title">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9z"/></svg>
      AI 요약보고서
    </span>
    <div class="rp-actions">
      <div class="rp-share-wrap">
        <button type="button" id="rpShare" class="btn btn-sm" aria-haspopup="menu" aria-expanded="false" aria-controls="shareMenu">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          공유하기
        </button>
        <div id="shareMenu" class="share-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="rpMail">메일로 보내기</button>
          <button type="button" role="menuitem" id="rpCopy">메신저용 텍스트 복사</button>
          <button type="button" role="menuitem" id="rpNative" hidden>이 기기의 공유 메뉴</button>
          <button type="button" role="menuitem" id="rpDownload">텍스트 파일 저장</button>
        </div>
      </div>
      <button type="button" id="rpPdf" class="btn btn-sm">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></svg>
        PDF 저장
      </button>
      <button type="button" id="rpPrint" class="btn btn-sm">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M6 14h12v7H6z"/></svg>
        출력
      </button>
      <button type="button" id="rpClose" class="btn btn-sm btn-icon" aria-label="요약보고서 닫기">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <article id="reportBody" class="report" tabindex="0"></article>
  <div id="rpToast" class="rp-toast" role="status" aria-live="polite" hidden></div>
</dialog>
<div id="printArea" aria-hidden="true"></div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/report.js"></script>
</body>
</html>
